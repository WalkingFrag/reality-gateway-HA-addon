name: "Reality Gateway"
version: "0.3.0"
slug: reality_gateway
description: "WireGuard gateway with AWG3 and VLESS egress failover"
url: "https://github.com/WalkingFrag/reality-gateway-HA-addon"
arch:
  - amd64
  - aarch64
  - armv7
host_network: true
ingress: true
ingress_port: 8099
panel_icon: mdi:router
panel_title: Reality Gateway
panel_admin: true
privileged:
  - NET_ADMIN
devices:
  - /dev/net/tun
init: false
options:
  vless_server: null
  vless_port: 444
  vless_uuid: null
  vless_flow: xtls-rprx-vision
  vless_reality_public_key: "QqAo_aC2hr-1ThVR-HFu4Vrn6mm4PKA4esLIhrgq42M"
  vless_reality_short_id: null
  vless_sni: www.googletagmanager.com
  wg_listen_port: 51821
  wg_server_address: 10.20.30.1/24
  wg_peer_allowed_ip: 10.20.30.2/32
  awg_exits: []
  awg_configs: []
  probe_targets: []
schema:
  vless_server: str
  vless_port: port
  vless_uuid: str
  vless_flow: str
  vless_reality_public_key: str
  vless_reality_short_id: str
  vless_sni: str
  wg_listen_port: port
  wg_server_address: str
  wg_peer_allowed_ip: str
  awg_exits:
    - id: str
      priority: int(1,99)
      endpoint: str
      address: str
      private_key: password
      peer_public_key: str
      preshared_key: password
      header_protection_key: password
      jc: int
      jmin: int
      jmax: int
      s1: int
      s2: int
      s3: int
      s4: int
      h1: int
      h2: int
      h3: int
      h4: int
      content_padding_addition: str
      rekey_after_time: str
      rekey_timeout: str
      reject_after_time: str
      keepalive_timeout: str
      max_handshake_attempts: str
      random_trailers: bool
      disable_cookies: bool
      persistent_keepalive: str
  awg_configs:
    - str
  probe_targets:
    - host: str
      ip: str
      path: str
      expected_status: int
